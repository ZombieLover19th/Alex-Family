    top:18px; right:18px; padding:10px 14px;

    max-width:min(640px, calc(100vw - 40px));

  .ctrl-btn{
    width:38px; height:38px; border-radius:12px; border:1px solid var(--panel-border);

  .speed-group select{
    background:rgba(10,16,32,.8); color:var(--text); border:1px solid var(--panel-border);

  .btn{
    border:1px solid var(--panel-border); background:rgba(122,176,255,.08); color:var(--text);
    border-radius:10px; padding:7px 12px; font-size:12.5px; cursor:pointer; transition:.2s;
  }

/* ================================================================
   工具函式：值雜訊（Value Noise）+ FBM
   ================================================================ */
function makeNoise2D(seed=1){
  const p = new Uint8Array(512);
  const table = [];
  for(let i=0;i<256;i++) table[i]=i;
  let s = seed >>> 0;
  const rand = ()=>{ s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; };
  for(let i=255;i>0;i--){ const j=Math.floor(rand()*(i+1)); const tmp=table[i]; table[i]=table[j]; table[j]=tmp; }
  for(let i=0;i<512;i++) p[i]=table[i&255];
  const fade = t => t*t*t*(t*(t*6-15)+10);
  const lerp = (a,b,t)=>a+(b-a)*t;
  return function(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    const xf=x-Math.floor(x), yf=y-Math.floor(y);
    const u=fade(xf), v=fade(yf);
    const a=p[p[X]+Y], b=p[p[X+1]+Y], c=p[p[X]+Y+1], d=p[p[X+1]+Y+1];
    return lerp(lerp(a/255,b/255,u), lerp(c/255,d/255,u), v);
  };
}
function fbm(noise,x,y,oct=4){
  let amp=0.5, freq=1, sum=0, norm=0;
  for(let i=0;i<oct;i++){ sum+=amp*noise(x*freq,y*freq); norm+=amp; amp*=0.5; freq*=2; }
  return sum/norm;
}
const N = {};
['mercury','mercury2','venus','earth','earth2','earth3','mars','mars2',
 'jupiter','jupiter2','saturn','saturn2','uranus','neptune','neptune2','moon','moon2']
 .forEach((k,i)=>{ N[k]=makeNoise2D(i+7); });

/* ================================================================
   程式化紋理產生器
   ================================================================ */
function buildTexture(w,h,pixelFn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  const img=ctx.createImageData(w,h);
  const d=img.data;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const [r,g,b]=pixelFn(x/w, y/h, x, y);
      const i=(y*w+x)*4;
      d[i]=Math.max(0,Math.min(255,r|0));
      d[i+1]=Math.max(0,Math.min(255,g|0));
      d[i+2]=Math.max(0,Math.min(255,b|0));
      d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=THREE.RepeatWrapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}

const TEX_FX = {
  mercury:(x,y)=>{
    const n=fbm(N.mercury,x*26,y*26,4);
    let v=115+n*65;
    const c=fbm(N.mercury2,x*70,y*70,3);
    if(c<0.40) v*=0.72;
    return [v*.98, v*.96, v*.92];
  },
  venus:(x,y)=>{
    const swirl=Math.sin((y*5+Math.sin(x*6.283*2)*0.7)*6.283);
    const n=fbm(N.venus,x*14,y*16,4);
    const base=200+28*swirl+22*n;
    return [base*1.04, base*.87, base*.61];
  },
  earth:(x,y)=>{
    const n=fbm(N.earth,x*11,y*11,5);
    const n2=fbm(N.earth2,x*26,y*26,4);
    const pole=Math.abs(y-0.5)*2;
    let col;
    if(n>0.55){
      const g=95+n2*85;
      col=[55+n2*55, g, 32];
    }else{
      col=[26+n*34, 50+n*50, 118+n*74];
    }
    if(pole>0.86){
      const w=Math.min(1,(pole-0.86)/0.14);
      col=col.map(v=>v+(252-v)*w);
    }
    const cloud=fbm(N.earth3,x*40,y*9,3);
    if(cloud>0.66) col=[238,240,246];
    return col;
  },
  mars:(x,y)=>{
    const n=fbm(N.mars,x*16,y*16,5);
    const n2=fbm(N.mars2,x*32,y*32,4);
    const base=150+n*75;
    let r=base*1.25, g=base*.56, b=base*.33;
    if(n2>0.62){ r*=.72; g*=.68; b*=.68; }
    const pole=Math.abs(y-0.5)*2;
    if(pole>0.9){
      const w=Math.min(1,(pole-0.9)/0.1);
      r+=(250-r)*w; g+=(247-g)*w; b+=(245-b)*w;
    }
    return [r,g,b];
  },
  jupiter:(x,y)=>{
    const bands=Math.sin(y*42 + fbm(N.jupiter,x*50,y*10,2)*11);
    let base;
    if(bands>0.85) base=[236,212,178];
    else if(bands>0.4) base=[200,168,130];
    else if(bands>-0.2) base=[228,200,162];
    else if(bands>-0.7) base=[178,144,108];
    else base=[238,216,182];
    const m=.85+fbm(N.jupiter2,x*64,y*64,3)*.3;
    let col=[base[0]*m, base[1]*m, base[2]*m];
    const dx=x-0.71, dy=(y-0.33)*1.55;
    const dd=dx*dx+dy*dy;
    if(dd<0.014){
      const t=1-Math.sqrt(dd)/0.118;
      col=[218, 92+70*t, 58+45*t];
    }
    return col;
  },
  saturn:(x,y)=>{
    const n=fbm(N.saturn,x*42,y*34,3);
    const bs=.78+.22*Math.sin(y*38+n*9);
    const m=.86+fbm(N.saturn2,x*52,y*52,3)*.26;
    return [236*bs*m, 216*bs*m, 182*bs*m];
  },
  uranus:(x,y)=>{
    const n=fbm(N.uranus,x*22,y*22,4);
    return [142+62*n, 222+28*n, 224+26*n];
  },
  neptune:(x,y)=>{
    const n=fbm(N.neptune,x*26,y*26,4);
    const band=Math.sin(y*34)*0.08;
    const v=42+n*48+band*40;
    const dx=x-0.62, dy=(y-0.44)*2;
    if(dx*dx+dy*dy<0.013) return [24, 50, 118];
    return [20+v*.6, 52+v, 196];
  },
  moon:(x,y)=>{
    const n=fbm(N.moon,x*32,y*32,4);
    let v=150+n*75;
    if(fbm(N.moon2,x*85,y*85,3)<0.40) v*=.7;
    return [v,v*.97,v*.93];
  }
};

/* 太陽紋理：放射漸層 + 顆粒感 + 黑子 */
function createSunTexture(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(256,256,0,256,256,256);
  g.addColorStop(0,'#fffdf0');
  g.addColorStop(0.22,'#ffefc0');
  g.addColorStop(0.5,'#ffd25e');
  g.addColorStop(0.82,'#ff9f1c');
  g.addColorStop(1,'#ff7800');
  ctx.fillStyle=g; ctx.fillRect(0,0,512,512);
  const img=ctx.getImageData(0,0,512,512); const d=img.data;
  const noise=makeNoise2D(42);
  for(let i=0;i<d.length;i+=4){
    const px=(i/4)%512, py=Math.floor((i/4)/512);
    const v=(fbm(noise,px/22,py/22,4)-0.5);
    d[i]+=v*100; d[i+1]+=v*72; d[i+2]+=v*40;
  }
  ctx.putImageData(img,0,0);
  // 黑子
  for(let i=0;i<4;i++){
    const cx=90+Math.random()*330, cy=80+Math.random()*350;
    ctx.fillStyle='rgba(130,60,10,0.32)';
    for(let k=0;k<5;k++){
      ctx.beginPath();
      ctx.ellipse(cx+Math.random()*36-18, cy+Math.random()*30-15, 4+Math.random()*12, 3+Math.random()*9, Math.random()*3, 0, 6.283);
      ctx.fill();
    }
  }
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}

/* 文字標籤 Sprite */
function makeTextSprite(text,color='#ecf2ff'){
  const fontSize=30, pad=14;
  const c=document.createElement('canvas');
  const tmp=c.getContext('2d');
  tmp.font=`600 ${fontSize}px "Segoe UI","Microsoft JhengHei",sans-serif`;
  const tw=tmp.measureText(text).width;
  c.width=Math.ceil(tw+pad*2);
  c.height=Math.ceil(fontSize*1.3+pad);
  const ctx=c.getContext('2d');
  const h=c.height;
  ctx.beginPath();
  const rr=18;
  ctx.moveTo(rr,0); ctx.lineTo(c.width-rr,0); ctx.arcTo(c.width,0,c.width,h-1,rr);
  ctx.lineTo(c.width,h-1); ctx.arcTo(c.width,h-1,0,h-1,rr);
  ctx.lineTo(0,h-1); ctx.arcTo(0,h-1,0,0,rr); ctx.lineTo(0,rr); ctx.closePath();
  ctx.fillStyle='rgba(8,12,28,0.62)'; ctx.fill();
  ctx.strokeStyle='rgba(140,180,255,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.font=`600 ${fontSize}px "Segoe UI","Microsoft JhengHei",sans-serif`;
  ctx.fillStyle=color; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor=color; ctx.shadowBlur=12;
  ctx.fillText(text, c.width/2, h/2+1);
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  const sp=new THREE.Sprite(mat);
  const f=0.008;
  sp.scale.set(c.width*f, c.height*f, 1);
  return sp;
}

function createStars(){

  const pos=new Float32Array(count*3), col=new Float32Array(count*3);
  const v=new THREE.Vector3();
  for(let i=0;i<count;i++){
    v.set(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize();
    if(Math.random()<0.65){ v.y*=0.16; v.normalize(); } // 銀河帶集中於盤面
    const rad=340+Math.random()*460;
    pos[i*3]=v.x*rad; pos[i*3+1]=v.y*rad; pos[i*3+2]=v.z*rad;
    const t=Math.random();
    let r,g,b;
    if(t<0.5){ r=255; g=255; b=255; }
    else if(t<0.75){ r=190; g=212; b=255; }
    else { r=255; g=224; b=186; }
    const br=0.35+Math.random()*0.65;
    col[i*3]=r*br/255; col[i*3+1]=g*br/255; col[i*3+2]=b*br/255;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:1.45, vertexColors:true, sizeAttenuation:true,
    transparent:true, opacity:0.9, depthWrite:false});

/* ================================================================
   軌道變換（橢圓 + 傾角 + 升交點黃經）
   ================================================================ */
const XAXIS=new THREE.Vector3(1,0,0);
const YAXIS=new THREE.Vector3(0,1,0);
const DEG=Math.PI/180;
const BASE_SPEED=Math.PI*2/40; // 地球 40 秒一圈（1× 時）
const lineMats=[];

function orbitPoint(meta, theta){
  const b=meta.dist*Math.sqrt(1-meta.ecc*meta.ecc);
  const c=meta.dist*meta.ecc;
  const p=new THREE.Vector3(meta.dist*Math.cos(theta)-c, 0, b*Math.sin(theta));
  p.applyAxisAngle(XAXIS, meta.incl);
  p.applyAxisAngle(YAXIS, meta.node);
  return p;
}

function buildOrbitLine(meta){
  const pts=[];
  for(let i=0;i<=360;i++){
    const p=orbitPoint(meta, i/360*Math.PI*2);
    pts.push(p.x, p.y, p.z);
  }
  const g=new LineGeometry(); g.setPositions(pts);
  const m=new LineMaterial({color:new THREE.Color(meta.color), linewidth:1.7,
    transparent:true, opacity:0.5, depthWrite:false, toneMapped:false});
  m.resolution.set(window.innerWidth, window.innerHeight);
  lineMats.push(m);
  const line=new Line2(g, m);
  scene.add(line);
  return line;
}

function buildRing(parent, inner, outer, kind){
  const geo=new THREE.RingGeometry(inner, outer, 128, 1);

    const r=Math.sqrt(v.x*v.x+v.y*v.y);
    uv.setXY(i, (r-inner)/(outer-inner), 0.5);

  const tex=createRingTexture(kind);

    depthWrite:false, opacity:0.95, toneMapped:false});

  ring.rotation.x=-Math.PI/2;
  ring.renderOrder=1;
  parent.add(ring);

const chkOrbits=document.getElementById('chk-orbits');
const chkLabels=document.getElementById('chk-labels');
const chkFollow=document.getElementById('chk-follow');
const btnReset=document.getElementById('btn-reset');
const timeEl=document.getElementById('time-display');

let playing=true;
let speed=1;
let followKey=null;

chkOrbits.addEventListener('change', ()=>{
  planets.forEach(p=>p.orbitLine.visible=chkOrbits.checked);
});
chkLabels.addEventListener('change', ()=>{
  const v=chkLabels.checked;
  planets.forEach(p=>p.label.visible=v);
  sunLabel.visible=v;
});
chkFollow.addEventListener('change', ()=>setFollow(chkFollow.checked));
btnPlay.addEventListener('click', ()=>{
  playing=!playing;
  btnPlay.textContent=playing?'⏸':'▶';
});
speedSel.addEventListener('change', ()=>{ speed=parseFloat(speedSel.value); });
btnReset.addEventListener('click', ()=>{
  setFollow(false);
  infoPanel.classList.add('hidden');
  updateChips();
  camera.position.set(0, 58, 148);
  controls.target.lerp(new THREE.Vector3(0,0,0), 1);
  controls.update();
});

function updateChips(){
  document.querySelectorAll('.chip').forEach(el=>{
    el.classList.toggle('active', el.dataset.key===followKey);
  });
}

function setFollow(flag){
  if(!flag){
    followKey=null;
  }
  chkFollow.checked=!!flag;
  if(flag && followKey && bodyByKey[followKey]){
    controls.target.copy(bodyByKey[followKey].pos);
  }
}

function selectPlanet(key){
  const d=DATA[key];
  if(!d) return;
  followKey=key;
  chkFollow.checked=true;
  updateChips();
  if(bodyByKey[key]) controls.target.copy(bodyByKey[key].pos);
  showInfo(key);
  infoPanel.classList.remove('hidden');
}

const row=(ic,k,v)=>`<div class="row"><span class="ic">${ic}</span><span class="k">${k}</span><span class="v">${v}</span></div>`;

function showInfo(key){
  const d=DATA[key];
  infoContent.innerHTML=`
    <div class="info-head">
      <span class="dot" style="background:${d.color};color:${d.color}"></span>
      <h2>${d.name}</h2>
      <span class="badge">${d.category}</span>
    </div>
    <div class="info-grid">
      ${row('📏','直徑',d.diameter)}
      ${row('⚖️','質量',d.mass)}
      ${row('🛰️','距太陽 / 距離',d.distance)}
      ${row('🕰️','公轉週期',d.period)}
      ${row('🔄','自轉週期',d.rotation)}
      ${row('🌙','天然衛星',d.moons)}
      ${row('🌡️','溫度',d.temp)}
      ${row('💨','平均軌道速度',d.speed)}
    </div>
    <p class="desc">${d.desc}</p>`;
  infoPanel.scrollTop=0;
}

/* ================================================================
   互動：hover + 點選（Raycaster）
   ================================================================ */
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
let downX=0, downY=0, moved=false;

canvas.addEventListener('pointerdown', e=>{
  downX=e.clientX; downY=e.clientY; moved=false;
});
canvas.addEventListener('pointermove', (e)=>{
  ndc.x=(e.clientX/window.innerWidth)*2-1;
  ndc.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(ndc, camera);
  const hit=raycaster.intersectObjects(clickables, false);
  canvas.style.cursor = hit.length>0 ? 'pointer' : 'grab';
  const dx=e.clientX-downX, dy=e.clientY-downY;
  if(Math.hypot(dx,dy)>6) moved=true;
});
canvas.addEventListener('pointerup', e=>{
  if(moved) return;
  ndc.x=(e.clientX/window.innerWidth)*2-1;
  ndc.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(ndc, camera);
  const hit=raycaster.intersectObjects(clickables, false);
  if(hit.length>0){
    const key=hit[0].object.userData.key;
    selectPlanet(key);
  }
});

/* ================================================================
   動畫主迴圈
   ================================================================ */
const clock=new THREE.Clock();
const ZERO=new THREE.Vector3(0,0,0);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(), 0.05);

  if(playing){
    const dt2=dt*speed;
    /* 太陽自轉 */
    sunMesh.rotation.y += dt*0.04;

    /* 行星公轉 + 自轉 */
    for(const p of planets){
      p.meta.totalAngle += p.meta.speed*dt2;
      p.pos.copy(orbitPoint(p.meta, p.meta.totalAngle));
      p.group.position.copy(p.pos);
      p.spin.rotation.y += p.meta.rot*dt;
    }

    /* 月球繞地球 */
    const earth=bodyByKey.earth;
    MOON.angle += MOON.speed*dt2;
    const off=new THREE.Vector3(
      Math.cos(MOON.angle)*MOON.r,
      Math.sin(MOON.angle)*MOON.r*0.12,
      Math.sin(MOON.angle)*MOON.r
    );
    off.applyAxisAngle(XAXIS, earth.meta.incl).applyAxisAngle(YAXIS, earth.meta.node);
    MOON.group.position.copy(earth.pos).add(off);
    MOON.mesh.rotation.y += dt;

    /* 模擬時間（以地球公轉為基準） */
    const rev=earth.meta.totalAngle/(Math.PI*2);
    const years=Math.floor(rev);
    const days=Math.floor((rev-years)*365.25);
    timeEl.textContent=`🕐 模擬時間：第 ${years} 年 ${String(days).padStart(3,'0')} 天`;
  }

  /* 追蹤天體 */
  if(followKey && bodyByKey[followKey]){
    const k=1-Math.exp(-dt*4);
    controls.target.lerp(bodyByKey[followKey].pos, k);
  } else if(controls.target.lengthSq()>0.001){
    controls.target.lerp(ZERO, 1-Math.exp(-dt*2));
  }

  controls.update();
  composer.render();
}

/* 尺寸調整 */
window.addEventListener('resize', ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.setSize(window.innerWidth, window.innerHeight);
  lineMats.forEach(m=>m.resolution.set(window.innerWidth, window.innerHeight));
});

/* 移除載入畫面 */
setTimeout(()=>{ document.getElementById('splash').classList.add('fade'); }, 600);
setTimeout(()=>{ document.getElementById('splash').style.display='none'; }, 1500);

animate();
</script>
</body>
</html>
